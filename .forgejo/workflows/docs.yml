name: Deploy documentation

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: Build docs but do not deploy
        required: false
        default: false
        type: boolean
  push:
    branches:
      - main
      - master
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'backend/app/**/*.py'
      - '.forgejo/workflows/docs.yml'

concurrency:
  group: ${{ forgejo.workflow }}-${{ forgejo.ref }}
  cancel-in-progress: true

jobs:

  deploy:

    runs-on: local-runner

    steps:
      - name: Checkout code
        uses: https://data.forgejo.org/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install uv
        uses: https://data.forgejo.org/astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          working-directory: backend

      - name: Sync documentation dependencies
        working-directory: backend
        run: uv sync --frozen --only-group docs
      - name: Build documentation
        run: uv run --no-sync --project backend mkdocs build --site-dir site

      - name: Set dry-run mode
        if: ${{ inputs.dry-run == true }}
        run: echo "DOCS_DRY_RUN=true" >> "$FORGEJO_ENV"

      - name: Deploy documentation to Codeberg Pages
        if: env.DOCS_DRY_RUN != 'true'
        uses: https://data.forgejo.org/actions/git-pages@2b24bbb7ff943d3c8fe1df91326adec66daea6dd # v2.2.0
        with:
          site: https://docs.endurain.com/
          server: codeberg.page
          token: ${{ forge.token }}
          source: site/