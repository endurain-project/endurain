name: Lint Backend

on:
  push:
    branches:
      - master
      - main
    paths:
      - backend/**
      - .forgejo/workflows/lint-backend.yml
  pull_request:
    paths:
      - backend/**
      - .forgejo/workflows/lint-backend.yml

concurrency:
  group: ${{ forgejo.workflow }}-${{ forgejo.ref }}
  cancel-in-progress: true

jobs:

  lint-backend:
    name: Backend (ruff)
    runs-on: local-runner
    steps:
      - name: Checkout code
        uses: https://data.forgejo.org/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Install uv
        uses: https://data.forgejo.org/astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          working-directory: backend

      - name: Sync dependencies
        working-directory: backend
        run: uv sync --frozen --only-group lint

      - name: Lint check
        working-directory: backend
        run: uv run --no-sync ruff check .

      - name: Format check
        working-directory: backend
        run: uv run --no-sync ruff format --check .
