# Round-robin over the api replicas through Docker's DNS. A variable in proxy_pass makes nginx resolve the name at
# request time, so `docker compose up --scale api=N` is picked up within the `valid` period.
worker_processes auto;
events { worker_connections 4096; }

http {
    resolver 127.0.0.11 valid=2s ipv6=off;
    access_log off;
    error_log /dev/stderr warn;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # The load generator names the client address it simulates, so per-client rate limits see many clients, as in
    # production, instead of the one address every request would share. Without the header the peer address is used.
    map $http_x_loadtest_client_ip $client_ip {
        default $remote_addr;
        "~."    $http_x_loadtest_client_ip;
    }

    server {
        listen 80;
        client_max_body_size 250m;

        location / {
            set $upstream http://api:8080;
            proxy_pass $upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $client_ip;
            proxy_set_header X-Forwarded-For $client_ip;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
            proxy_next_upstream error timeout http_502 http_503;
        }
    }
}
