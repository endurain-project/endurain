resources:
  limits:
    cpus: 2.0
    memory: 4096

TZ: Etc/UTC

endurain:
  postgres_image_selector: postgres_17_image
  db_password: test-db-password
  secret_key: test-secret-key-0123456789abcdef0123456789abcdef
  fernet_key: dGVzdC1mZXJuZXQta2V5LTAxMjM0NTY3ODlhYmNkZWY=
  endurain_host: http://localhost:30200
  behind_proxy: false
  additional_envs: []

network:
  web_port:
    bind_mode: published
    port_number: 30200

ix_volumes:
  data: /opt/tests/mnt/endurain/data
  logs: /opt/tests/mnt/endurain/logs
  postgres_data: /opt/tests/mnt/endurain/postgres-data

storage:
  data:
    type: ix_volume
    ix_volume_config:
      dataset_name: data
      create_host_path: true
  logs:
    type: ix_volume
    ix_volume_config:
      dataset_name: logs
      create_host_path: true
  postgres_data:
    type: ix_volume
    ix_volume_config:
      dataset_name: postgres_data
      create_host_path: true
  additional_storage: []
