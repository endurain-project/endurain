[project]
name = "endurain"
version = "0.22.0-beta1"
description = "Endurain API for the Endurain app"
authors = [{name = "João Vitória Silva", email = "joao@endurain.com"}]
# readme intentionally omitted — internal app, not published to PyPI
requires-python = ">=3.15,<4.0"
dependencies = [
    "fastapi>=0.162.2",
    "uvicorn>=0.54.0",
    "python-dotenv>=1.2.4",
    "sqlalchemy>=2.1.8",
    "apscheduler>=3.11.3",
    "requests>=2.34.2",
    "stravalib>=2.6.0",
    "python-multipart>=0.0.33",
    "gpxpy>=1.6.2",
    "tcxreader>=0.4.11",
    "alembic>=1.20.1",
    "joserfc>=1.8.0",
    "fitdecode>=0.11.0",
    "numpy>=2.5.4",
    "geopy>=2.5.0",
    "pydantic-core>=2.50.4",
    "pydantic-settings>=2.16.2",
    "garminconnect>=0.3.20",
    "websockets>=17.4",
    "timezonefinder>=9.2.0",
    "psycopg[binary,pool]>=3.3.8",
    "user-agents>=2.2.0",
    "pydantic[email]>=2.14.3",
    "pyotp>=2.10.0",
    "qrcode[pil]>=8.2",
    "pillow>=13.0.0",
    "psutil>=7.2.2",
    "python-magic>=0.4.27",
    "pwdlib[argon2]>=0.3.1",
    "authlib>=1.9.5",
    "httpx2>=2.16.0",
    "itsdangerous>=2.2.0",
    "slowapi>=0.1.10",
    "safeuploads[fastapi]>=4.0.1",
    "nh3>=0.3.7",
    "staticmap>=0.5.7",
    # Pinned below the next minor: JASIL is pre-1.0 and documents breaking
    # changes on minor versions.
    "jasil[audit,fastapi,geocoding,jobs,migrations]>=0.22.3,<0.23.0",
]

[project.optional-dependencies]
# Extra pulled in for multi-node (`distributed`) deployments: Redis-backed
# shared state / event bus and S3-compatible object storage. The default image
# (`uv export --no-dev`) ships neither, so `local` deployments stay lean.
distributed = [
    "boto3>=1.43.126",
    "redis>=8.1.0",
    "jasil[redis,s3]>=0.22.3,<0.23.0",
]

[dependency-groups]
typecheck = [
    "mypy>=2.4.1",
    "ty>=0.0.99",
    "types-requests",
    "types-psutil",
    "types-qrcode",
    "types-Authlib",
]
lint = [
    "ruff>=0.17.4",
]
test = [
    "httpx2>=2.16.0",
    "hypothesis>=6.170.15",
    "import-linter>=2.16",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "pytest-cov>=7.1.0",
    "boto3>=1.43.126",
    "redis>=8.1.0",
    "pytest-xdist>=3.8.0",
    "testcontainers[postgres]>=4.15.0",
]
dev = [
    "hatch>=1.18.2",
    {include-group = "lint"},
    {include-group = "test"},
    {include-group = "typecheck"},
]
docs = [
    "mkdocs-material>=9.8.1",
    "mkdocstrings[python]>=1.0.8",
    "mkdocs-redirects>=1.2.3",
    "mkdocs-swagger-ui-tag>=0.8.1",
]

[tool.uv]
required-version = "0.13.9"
exclude-newer = "7 days"
# jasil and safeuploads are first-party (endurain-project) and published through
# PyPI Trusted Publishing with PEP 740 attestations, so they are exempt from the
# quarantine the cutoff applies to third-party releases. Every other dependency
# keeps it.
exclude-newer-package = { jasil = false, safeuploads = false }

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.hatch.build.targets.sdist]
only-include = ["app"]

[tool.hatch.envs.default]
type = "virtual"
path = ".venv"

[tool.hatch.envs.default.scripts]
lint = "ruff check . --fix"
format = "ruff format ."
lint-check = "ruff check ."
format-check = "ruff format --check ."
test = "pytest -n auto --cov --cov-report=term-missing"
typecheck = "mypy"
typecheck-ty = "ty check"
validate = ["lint", "format", "test", "typecheck"]
check = ["lint-check", "format-check", "test", "typecheck"]

[tool.pytest.ini_options]
pythonpath = ["app"]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--tb=short --strict-markers"
markers = [
    "distributed: runs real API and worker processes against disposable PostgreSQL, Redis and S3 (TEST_DATABASE_URL, TEST_REDIS_URL, TEST_S3_ENDPOINT_URL); skipped unless all are set",
]
filterwarnings = [
    "ignore::DeprecationWarning:slowapi.*",
]

[tool.coverage.run]
source = ["app"]
branch = true
omit = ["*/tests/*", "*/__pycache__/*", "*/alembic/*", "*/migrations/*"]

[tool.coverage.report]
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.mypy]
python_version = "3.15"
incremental = false
check_untyped_defs = true
disallow_untyped_defs = true
disallow_any_generics = true
mypy_path = ["app"]
files = ["app"]
exclude = ["tests/", "alembic/"]

[[tool.mypy.overrides]]
module = [
    "apscheduler.*",
    "staticmap",
    "fitdecode",
    "geopy.*",
    "tcxreader.*",
    "user_agents",
    "boto3",
    "botocore.*",
]
ignore_missing_imports = true

[tool.ty.environment]
python-version = "3.15"
root = ["app"]

[tool.ty.src]
include = ["app"]
exclude = ["tests/", "app/alembic/"]

[tool.ty.analysis]
allowed-unresolved-imports = [
    "apscheduler.**",
    "staticmap",
    "fitdecode",
    "geopy.**",
    "tcxreader.**",
    "user_agents",
    "boto3",
    "botocore.**",
]

[tool.ruff]
target-version = "py315"
line-length = 120
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "S",      # flake8-bandit (security)
    "A",      # flake8-builtins
    "T20",    # flake8-print
    "SIM",    # flake8-simplify
    "RUF",    # ruff-specific rules
    "D",      # pydocstyle; see per-file-ignores for the exempt paths
]
ignore = [
    "B008",   # do not perform function calls in argument defaults (FastAPI Depends/Query) — tracked in https://github.com/endurain-project/endurain/issues/653
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pep8-naming]
# SQLAlchemy's declared_attr is called with the mapped class, so its methods take cls.
classmethod-decorators = ["sqlalchemy.orm.declared_attr"]

[tool.ruff.lint.per-file-ignores]
# Docstring rules apply to every application module; only tests, scripts and Alembic revision files are exempt.
"scripts/**/*.py" = ["D"]
"tests/**/*.py" = ["D", "S101", "S105", "S106", "S108"]  # allow assert, password-like test data, and hardcoded /tmp-style paths in test mocks/fixtures
"app/alembic/**/*.py" = ["D", "E402", "I001"]  # alembic migrations have specific import order; docstrings not required
"app/modules/auth/identity_providers/public_router.py" = ["S105", "S106"]  # false positive on token_type
"app/modules/auth/authentication/schema.py" = ["S105", "S106"]  # false positive on token_type Literal defaults
"app/modules/auth/authentication/service.py" = ["S105", "S106"]  # false positive on token_type string comparisons
"app/modules/auth/authentication/sso_exchange_service.py" = ["S105", "S106"]  # false positive on token_type string comparisons
"app/modules/auth/authentication/dependencies.py" = ["S105", "S106"]  # false positive on cookie name constants
"app/modules/auth/account_security/events.py" = ["S105"]  # false positive on the password-change event values
"app/modules/auth/known_devices/events.py" = ["S105"]  # false positive on the password sign-in method value
"app/main.py" = ["S105"]  # false positive on env var value
"app/modules/**/audit_actions.py" = ["S105"]  # false positive on enum members naming a credential kind ("password")

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
