name: Password Blocklist Update

# Rebuilds the committed password blocklist from the latest SecLists commit and
# opens a pull request when it changed. The image build only copies the
# committed list, so every change to it is reviewed and traceable to one
# upstream commit (see backend/app/modules/auth/credentials/data/).

on:
  schedule:
    # 05:00 UTC on the first day of each quarter
    - cron: "0 5 1 1,4,7,10 *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:

  update:
    name: Rebuild the password blocklist
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          working-directory: backend

      - name: Resolve the latest SecLists commit
        id: source
        run: |
          commit="$(git ls-remote https://github.com/danielmiessler/SecLists.git refs/heads/master | cut -f1)"
          if ! [[ "$commit" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Could not resolve the SecLists commit" >&2
            exit 1
          fi
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      - name: Rebuild the list
        working-directory: backend
        env:
          SECLISTS_COMMIT: ${{ steps.source.outputs.commit }}
        # The script uses only the standard library, so no dependencies are installed.
        run: uv run --no-project python scripts/build_password_blocklist.py "$SECLISTS_COMMIT"

      - name: Open a pull request when the list changed
        env:
          GH_TOKEN: ${{ github.token }}
          SECLISTS_COMMIT: ${{ steps.source.outputs.commit }}
        run: |
          data=backend/app/modules/auth/credentials/data
          if git diff --quiet -- "$data"; then
            echo "The password blocklist is up to date."
            exit 0
          fi
          branch="chore/password-blocklist-${SECLISTS_COMMIT:0:12}"
          if git ls-remote --exit-code --heads "https://github.com/${GITHUB_REPOSITORY}.git" "$branch" >/dev/null; then
            echo "A pull request branch for this commit already exists."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add -- "$data"
          git commit -m "chore(auth): update the password blocklist to SecLists ${SECLISTS_COMMIT:0:12}"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$branch"
          gh pr create --base "${GITHUB_REF_NAME}" --head "$branch" \
            --title "chore(auth): update the password blocklist to SecLists ${SECLISTS_COMMIT:0:12}" \
            --body "Rebuilt by \`backend/scripts/build_password_blocklist.py\` from SecLists commit ${SECLISTS_COMMIT}. Review the manifest diff (entry count and source hashes) before merging."
