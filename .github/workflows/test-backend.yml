name: Test Backend

on:
  push:
    branches:
      - master
      - main
    paths:
      - backend/**
      - .github/workflows/test-backend.yml
  pull_request:
    branches:
      - master
      - release/**
    paths:
      - backend/**
      - .github/workflows/test-backend.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:

  test-backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Disposable maintenance database: the run migrates a template beside it and
    # gives each pytest-xdist worker a clone of its own.
    services:
      postgres:
        image: postgres:18@sha256:2ea8630df176ad090ec92136dee850397c5af8781e4bcf2e4162593691c61bbc
        env:
          POSTGRES_USER: endurain
          POSTGRES_PASSWORD: test
          POSTGRES_DB: endurain_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U endurain -d endurain_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          working-directory: backend

      - name: Sync dependencies
        working-directory: backend
        run: uv sync --frozen --no-dev --group test --no-install-project

      - name: Check auth import boundaries
        working-directory: backend
        run: PYTHONPATH=app uv run --no-sync lint-imports

      # The database is thrown away with the job, so nothing it writes needs to reach the disk: each test clones the
      # template, and without the flushes a clone is several times faster. All three settings apply on a reload.
      - name: Turn off durability on the test database
        run: >-
          docker exec ${{ job.services.postgres.id }} psql -U endurain -d endurain_test -v ON_ERROR_STOP=1
          -c "ALTER SYSTEM SET fsync = off"
          -c "ALTER SYSTEM SET synchronous_commit = off"
          -c "ALTER SYSTEM SET full_page_writes = off"
          -c "SELECT pg_reload_conf()"

      - name: Run tests
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql+psycopg://endurain:test@localhost:5432/endurain_test
        run: uv run --no-sync pytest -n auto --cov --cov-report=term-missing
